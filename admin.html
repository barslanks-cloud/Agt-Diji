<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Arial;background:#111827;color:white;padding:20px}
input{padding:10px;width:100%;margin:5px 0}
button{padding:10px;background:#3b82f6;border:none;color:white;border-radius:6px}
.card{background:#1f2937;padding:10px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>

<h1>⚙ Admin Panel</h1>

<!-- ÜRÜN EKLE -->
<h2>Ürün Ekle</h2>
<input id="pname" placeholder="Ürün adı">
<input id="pprice" placeholder="Fiyat">
<input id="pdesc" placeholder="Açıklama">
<button onclick="addProduct()">Ekle</button>

<hr>

<!-- SİPARİŞLER -->
<h2>Siparişler</h2>
<div id="orders"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDiORFeKwko9d4YpXpj-qzfQ2-Pie5wuZI",
  authDomain: "online-a837e.firebaseapp.com",
  projectId: "online-a837e",
  storageBucket: "online-a837e.firebasestorage.app",
  messagingSenderId: "368141673909",
  appId: "1:368141673909:web:952a28912f3d04078865fc",
  measurementId: "G-STCBMJ0LH4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ÜRÜN EKLE */
function addProduct(){
  db.collection("products").add({
    name:pname.value,
    price:pprice.value,
    desc:pdesc.value
  })
  alert("Ürün eklendi")
}

/* SİPARİŞLER */
db.collection("orders").onSnapshot(snap=>{
  let html=""
  snap.forEach(doc=>{
    let o=doc.data()
    html+=`
    <div class="card">
      <b>${o.name}</b><br>
      ${o.product}<br>
      <b>Durum:</b> ${o.status}
      <br><br>
      <button onclick="update('${doc.id}','Hazırlanıyor')">Hazırla</button>
      <button onclick="update('${doc.id}','Tamamlandı')">Tamamla</button>
    </div>`
  })
  orders.innerHTML=html
})

function update(id,status){
  db.collection("orders").doc(id).update({
    status:status
  })
}
</script>

</body>
</html>
