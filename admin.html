<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Agt Dijital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); padding: 15px; color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { padding: 12px 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; color: #64748b; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: inherit; }
        .btn { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .p-item { background: #f8fafc; padding: 15px; border-radius: 16px; margin-bottom: 15px; position: relative; border: 1px solid #e2e8f0; }
        .p-remove { position: absolute; right: 10px; top: 10px; color: #ef4444; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; background: #f8fafc; padding: 10px; font-size: 0.75rem; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        #login-ui { max-width: 400px; margin: 80px auto; }
        #admin-ui { display: none; }
        .order-detail { display: none; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container" id="login-ui">
        <div class="card">
            <h2 style="text-align:center; margin-bottom:20px">Yönetici Girişi</h2>
            <input type="email" id="email" placeholder="E-posta" style="margin-bottom:10px">
            <input type="password" id="pass" placeholder="Şifre">
            <button class="btn btn-primary" onclick="login()">Giriş Yap</button>
        </div>
    </div>

    <div class="container" id="admin-ui">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('settings')">Ayarlar</button>
            <button class="tab-btn" onclick="switchTab('products')">Ürünler</button>
            <button class="tab-btn" onclick="switchTab('orders')">Siparişler (<span id="count">0</span>)</button>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="card">
                <h2>Mağaza Ayarları</h2>
                <div class="form-group"><label>Mağaza Adı</label><input type="text" id="m-name"></div>
                <div class="form-group"><label>Slogan</label><input type="text" id="m-tagline"></div>
                <button class="btn btn-primary" onclick="saveAll()">Kaydet</button>
            </div>
        </div>

        <div id="tab-products" class="tab-content" style="display:none">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                    <h2>Ürün Yönetimi</h2>
                    <button class="btn" style="background:#10b981; color:white; width:auto" onclick="addProductItem()">+ Yeni Ürün</button>
                </div>
                <div id="p-container"></div>
                <button class="btn btn-primary" onclick="saveAll()">Ürünleri Kaydet</button>
            </div>
        </div>

        <div id="tab-orders" class="tab-content" style="display:none">
            <div class="card" style="overflow-x:auto">
                <h2>Gelen Siparişler</h2>
                <table id="orders-table">
                    <thead><tr><th>Müşteri</th><th>Tarih</th><th>Tutar</th><th>Durum</th><th></th></tr></thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </div>

        <button class="btn" style="background:#ef4444; color:white; margin-top:20px" onclick="logout()">Çıkış Yap</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDiORFeKwko9d4YpXpj-qzfQ2-Pie5wuZI", authDomain: "online-a837e.firebaseapp.com", projectId: "online-a837e", storageBucket: "online-a837e.firebasestorage.app", messagingSenderId: "368141673909", appId: "1:368141673909:web:952a28912f3d04078865fc", measurementId: "G-STCBMJ0LH4" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'default-store';

        window.login = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Giriş Hatası!"));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            document.getElementById('login-ui').style.display = user ? 'none' : 'block';
            document.getElementById('admin-ui').style.display = user ? 'block' : 'none';
            if(user) { fetchStore(); fetchOrders(); }
        });

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-' + id).style.display = 'block';
            event.target.classList.add('active');
        };

        window.addProductItem = (t='', pr='', d='', im='') => {
            const div = document.createElement('div');
            div.className = 'p-item';
            div.innerHTML = `<i class="fas fa-trash p-remove" onclick="this.parentElement.remove()"></i>
                <div class="form-group"><label>Ürün Adı</label><input type="text" class="p-title" value="${t}"></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                    <div class="form-group"><label>Fiyat</label><input type="number" class="p-price" value="${pr}"></div>
                    <div class="form-group"><label>Görsel URL</label><input type="text" class="p-img" value="${im}"></div>
                </div>
                <div class="form-group"><label>Açıklama</label><input type="text" class="p-desc" value="${d}"></div>`;
            document.getElementById('p-container').appendChild(div);
        };

        async function fetchStore() {
            // 6 segmentli döküman yolu
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'website'));
            if(snap.exists()){
                const d = snap.data();
                document.getElementById('m-name').value = d.name || '';
                document.getElementById('m-tagline').value = d.tagline || '';
                document.getElementById('p-container').innerHTML = '';
                (d.products || []).forEach(p => addProductItem(p.title, p.price, p.desc, p.img));
            }
        }

        window.saveAll = async () => {
            const products = Array.from(document.querySelectorAll('.p-item')).map(el => ({
                title: el.querySelector('.p-title').value,
                price: parseFloat(el.querySelector('.p-price').value) || 0,
                img: el.querySelector('.p-img').value,
                desc: el.querySelector('.p-desc').value
            }));
            const data = {
                name: document.getElementById('m-name').value,
                tagline: document.getElementById('m-tagline').value,
                products: products
            };
            try {
                // 6 segmentli döküman yolu: artifacts / appId / public / data / content / website
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'content', 'website'), data);
                alert("Kaydedildi!");
            } catch(e) { alert("Kaydetme Hatası: " + e.message); }
        };

        function fetchOrders() {
            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snap) => {
                const list = [];
                snap.forEach(doc => list.push({id: doc.id, ...doc.data()}));
                renderOrders(list);
            });
        }

        function renderOrders(orders) {
            document.getElementById('count').innerText = orders.length;
            const body = document.getElementById('orders-body');
            orders.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            body.innerHTML = orders.map(o => {
                const date = o.createdAt ? new Date(o.createdAt.seconds * 1000).toLocaleString('tr-TR') : '...';
                return `
                <tr>
                    <td><b>${o.customer?.name}</b><br><small>${o.customer?.phone}</small></td>
                    <td>${date}</td>
                    <td><b>${o.total.toFixed(2)} TL</b></td>
                    <td>${o.status}</td>
                    <td><button onclick="toggleD('${o.id}')">Detay</button></td>
                </tr>
                <tr id="det-${o.id}" class="order-detail">
                    <td colspan="5" style="background:#fff; padding:15px; border-radius:10px">
                        <b>Adres:</b> ${o.shipping?.address}, ${o.shipping?.city}<br>
                        <b>Ödeme:</b> ${o.payment}<br>
                        <b>Ürünler:</b><br>${o.items.map(i => `• ${i.title} (${i.qty} x ${i.price} TL)`).join('<br>')}
                    </td>
                </tr>`;
            }).join('');
        }

        window.toggleD = (id) => {
            const el = document.getElementById('det-' + id);
            el.style.display = el.style.display === 'table-row' ? 'none' : 'table-row';
        };
    </script>
</body>
</html>
