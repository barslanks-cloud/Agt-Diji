<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f8fafc;color:#0f172a}
header{background:white;padding:15px;position:sticky;top:0;box-shadow:0 2px 10px #0001}
.container{max-width:1000px;margin:auto;padding:15px}
.card{background:white;padding:15px;margin:10px 0;border-radius:12px}
button{background:#2563eb;color:white;border:none;padding:10px;border-radius:8px}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
</style>
</head>
<body>

<header>
<h2 id="title">Yükleniyor...</h2>
</header>

<div class="container">

<h2>📦 Ürünler</h2>
<div class="grid" id="products"></div>

<h2>ℹ️ Hakkında</h2>
<div class="card" id="about"></div>

<h2>❓ SSS</h2>
<div class="card" id="faq"></div>

<h2>📞 İletişim</h2>
<div class="card" id="contact"></div>

<h2>🛒 Sipariş</h2>
<div class="card">
<input id="name" placeholder="Ad">
<input id="phone" placeholder="Telefon">
<input id="product" placeholder="Ürün">
<button onclick="order()">Sipariş Ver</button>
<p id="code"></p>
</div>

<h2>🔍 Sipariş Sorgula</h2>
<div class="card">
<input id="search" placeholder="Kod">
<button onclick="check()">Sorgula</button>
<p id="result"></p>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDiORFeKwko9d4YpXpj-qzfQ2-Pie5wuZI",
  authDomain: "online-a837e.firebaseapp.com",
  projectId: "online-a837e",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* SİTE İÇERİKLERİ */
function loadContent(){
  db.collection("siteContent").doc("main").onSnapshot(doc=>{
    let d=doc.data()
    if(!d) return
    title.innerText=d.homeTitle
    about.innerText=d.about
    faq.innerText=d.faq
    contact.innerText=d.contact
  })
}

/* ÜRÜNLER */
db.collection("products").onSnapshot(snap=>{
  let html=""
  snap.forEach(d=>{
    let p=d.data()
    html+=`<div class="card"><b>${p.name}</b><br>${p.price} TL</div>`
  })
  products.innerHTML=html
})

/* SİPARİŞ */
function order(){
  let code="AGT"+Math.floor(Math.random()*99999)

  db.collection("orders").add({
    name:name.value,
    phone:phone.value,
    product:product.value,
    status:"Beklemede",
    code:code
  })

  code.innerText="Kod: "+code
}

/* SORGULA */
function check(){
  db.collection("orders").where("code","==",search.value).get()
  .then(snap=>{
    if(snap.empty) result.innerText="Bulunamadı"
    else snap.forEach(d=>{
      result.innerText="Durum: "+d.data().status
    })
  })
}

loadContent()
</script>

</body>
</html>
