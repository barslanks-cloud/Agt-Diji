<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yükleniyor... | Online Mağaza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --text: #f1f5f9; --muted: #94a3b8; --card-bg: rgba(30, 41, 59, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        
        #loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }

        /* Nav */
        nav { position: sticky; top: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .cart-trigger { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; position: relative; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; font-size: 11px; padding: 2px 6px; border-radius: 20px; border: 2px solid var(--bg); }

        /* Hero */
        .hero { text-align: center; padding: 4rem 1rem; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Products */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .p-card { background: var(--card-bg); border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; }
        .p-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .p-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #1e293b; }
        .p-body { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .p-price { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin: 0.5rem 0 1.5rem; }
        .add-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: auto; }

        /* Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; display: none; overflow-y: auto; padding: 1rem; }
        .modal { background: #1e293b; width: 100%; max-width: 600px; margin: 2rem auto; border-radius: 28px; padding: 2.5rem; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 20px; font-size: 1.5rem; cursor: pointer; opacity: 0.6; }

        /* Checkout Form */
        .form-section { margin-bottom: 2rem; }
        .form-section h3 { margin-bottom: 1rem; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 12px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: inherit; margin-bottom: 10px; }
        input:focus { border-color: var(--primary); outline: none; }
        
        .checkout-summary { background: rgba(99, 102, 241, 0.1); padding: 1.5rem; border-radius: 18px; margin-bottom: 1.5rem; }
        .final-btn { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 1.1rem; cursor: pointer; }

        /* Cart Items */
        .cart-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-item img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .qty-controls { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #fff; background: none; color: white; cursor: pointer; }

        footer { text-align: center; padding: 4rem 1rem; border-top: 1px solid rgba(255,255,255,0.05); }
        .agt-link { color: var(--primary); text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <div id="loading-screen"><i class="fas fa-circle-notch fa-spin fa-3x" style="color:var(--primary)"></i></div>

    <nav>
        <div class="nav-inner">
            <h2 id="s-logo" style="font-weight:800">ONLINE MAĞAZA</h2>
            <button class="cart-trigger" onclick="openCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="c-badge">0</span>
            </button>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <h1 id="s-title">Yeni Koleksiyon</h1>
            <p id="s-tagline" class="tagline">Seçkin ürünler, güvenli alışveriş.</p>
        </header>
        <div class="products-grid" id="p-list"></div>
    </div>

    <!-- Sepet Modal -->
    <div class="overlay" id="cart-overlay">
        <div class="modal">
            <i class="fas fa-times close-btn" onclick="closeCart()"></i>
            <h2 style="margin-bottom:1.5rem">Sepetim</h2>
            <div id="c-items"></div>
            <div id="c-total" style="text-align:right; font-size:1.4rem; font-weight:800; margin:1.5rem 0">Toplam: 0 TL</div>
            <button class="add-btn" id="go-checkout" onclick="openCheckout()">Siparişi Tamamla</button>
        </div>
    </div>

    <!-- Ödeme Formu Modal -->
    <div class="overlay" id="checkout-overlay">
        <div class="modal">
            <i class="fas fa-times close-btn" onclick="closeCheckout()"></i>
            <h2 style="margin-bottom:1.5rem">Sipariş Formu</h2>
            <form id="order-form">
                <div class="form-section">
                    <h3>Kişisel Bilgiler</h3>
                    <input type="text" id="o-name" placeholder="Adınız Soyadınız" required>
                    <div class="input-row">
                        <input type="email" id="o-email" placeholder="E-posta" required>
                        <input type="tel" id="o-phone" placeholder="Telefon (05xx...)" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Fatura & Teslimat</h3>
                    <textarea id="o-address" placeholder="Tam Adresiniz" rows="3" required></textarea>
                    <div class="input-row">
                        <input type="text" id="o-city" placeholder="Şehir" required>
                        <input type="text" id="o-zip" placeholder="Posta Kodu" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Ödeme Yöntemi</h3>
                    <select id="o-payment" required>
                        <option value="Kredi Kartı">Kredi Kartı (Online)</option>
                        <option value="Havale / EFT">Havale / EFT</option>
                        <option value="Kapıda Ödeme">Kapıda Ödeme</option>
                    </select>
                </div>

                <div class="checkout-summary">
                    <div id="o-summary-total" style="font-weight: 800; text-align: center;">Toplam Tutar: 0 TL</div>
                </div>

                <button type="submit" class="final-btn" id="submit-order">Siparişi Onayla</button>
            </form>
        </div>
    </div>

    <footer>
        <p id="s-copy">&copy; 2024. Tüm Hakları Saklıdır.</p>
        <div style="margin-top:10px">Powered By <a href="https://www.agtdijital.com" target="_blank" class="agt-link">Agt Dijital</a></div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // GÜNCEL API CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDiORFeKwko9d4YpXpj-qzfQ2-Pie5wuZI",
            authDomain: "online-a837e.firebaseapp.com",
            projectId: "online-a837e",
            storageBucket: "online-a837e.firebasestorage.app",
            messagingSenderId: "368141673909",
            appId: "1:368141673909:web:952a28912f3d04078865fc",
            measurementId: "G-STCBMJ0LH4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let cart = [];
        let siteData = {};
        const appId = 'default-store';

        async function init() {
            try {
                await signInAnonymously(auth);
                // Verileri çek (bio-data/main-content dökümanından)
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'content'), (snap) => {
                    if (snap.exists()) {
                        siteData = snap.data();
                        renderSite();
                        document.getElementById('loading-screen').style.display = 'none';
                    } else {
                        // Boşsa uyarı ver veya varsayılan göster
                        console.log("Henüz içerik girilmemiş.");
                        document.getElementById('loading-screen').style.display = 'none';
                    }
                });
            } catch (err) {
                console.error("Başlatma hatası:", err);
            }
        }

        function renderSite() {
            document.getElementById('s-logo').innerText = siteData.name || "MAĞAZA";
            document.getElementById('s-title').innerText = siteData.tagline || "Hoş Geldiniz";
            const list = document.getElementById('p-list');
            list.innerHTML = (siteData.products || []).map((p, i) => `
                <div class="p-card">
                    <img src="${p.img || 'https://via.placeholder.com/300'}" class="p-img">
                    <div class="p-body">
                        <h3>${p.title}</h3>
                        <p style="color:var(--muted); font-size:0.85rem; margin-bottom:10px">${p.desc}</p>
                        <div class="p-price">${p.price} TL</div>
                        <button class="add-btn" onclick="addToCart(${i})">Sepete Ekle</button>
                    </div>
                </div>
            `).join('');
        }

        window.addToCart = (i) => {
            const p = siteData.products[i];
            const exists = cart.find(x => x.title === p.title);
            if(exists) exists.qty++; else cart.push({...p, qty: 1});
            updateCart();
        };

        function updateCart() {
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const totalPrice = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById('c-badge').innerText = totalQty;
            document.getElementById('c-total').innerText = `Toplam: ${totalPrice.toFixed(2)} TL`;
            document.getElementById('o-summary-total').innerText = `Toplam Tutar: ${totalPrice.toFixed(2)} TL`;
            
            document.getElementById('c-items').innerHTML = cart.map((x, i) => `
                <div class="cart-item">
                    <img src="${x.img}">
                    <div>
                        <div style="font-weight:700; font-size:0.9rem">${x.title}</div>
                        <div style="color:var(--primary); font-weight:800">${x.price} TL</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                        <span>${x.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('go-checkout').style.display = cart.length ? 'block' : 'none';
        }

        window.changeQty = (i, d) => {
            cart[i].qty += d;
            if(cart[i].qty < 1) cart.splice(i, 1);
            updateCart();
        };

        window.openCart = () => document.getElementById('cart-overlay').style.display = 'block';
        window.closeCart = () => document.getElementById('cart-overlay').style.display = 'none';
        window.openCheckout = () => { closeCart(); document.getElementById('checkout-overlay').style.display = 'block'; };
        window.closeCheckout = () => document.getElementById('checkout-overlay').style.display = 'none';

        // Siparişi Firestore'a kaydet
        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-order');
            btn.disabled = true;
            btn.innerText = "Sipariş Alınıyor...";

            const orderData = {
                customer: {
                    name: document.getElementById('o-name').value,
                    email: document.getElementById('o-email').value,
                    phone: document.getElementById('o-phone').value,
                },
                shipping: {
                    address: document.getElementById('o-address').value,
                    city: document.getElementById('o-city').value,
                    zip: document.getElementById('o-zip').value,
                },
                payment: document.getElementById('o-payment').value,
                items: cart,
                total: cart.reduce((a, b) => a + (b.price * b.qty), 0),
                status: 'Yeni Sipariş',
                createdAt: serverTimestamp()
            };

            try {
                // Rule 1 Path: artifacts/default-store/public/data/orders
                const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
                await addDoc(ordersRef, orderData);
                alert("Siparişiniz başarıyla alındı! En kısa sürede iletişime geçeceğiz.");
                cart = [];
                updateCart();
                closeCheckout();
                document.getElementById('order-form').reset();
            } catch (err) {
                console.error(err);
                alert("Hata: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Siparişi Onayla";
            }
        };

        init();
    </script>
</body>
</html>
