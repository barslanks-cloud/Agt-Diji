<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Sipariş Sistemi</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:20px}
h1,h2{color:#38bdf8}
.card{background:#1e293b;padding:15px;border-radius:10px;margin:10px 0}
input,textarea{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:none}
button{padding:10px;background:#22c55e;border:none;color:white;border-radius:8px;cursor:pointer}
small{color:#94a3b8}
</style>
</head>
<body>

<h1>🚀 Online Sipariş Sistemi</h1>

<!-- ÜRÜNLER -->
<h2>Ürünler</h2>
<div id="products"></div>

<hr>

<!-- SİPARİŞ -->
<h2>Sipariş Ver</h2>
<input id="name" placeholder="Ad Soyad">
<input id="phone" placeholder="Telefon">
<input id="product" placeholder="Ürün Adı">
<textarea id="note" placeholder="Not (opsiyonel)"></textarea>
<button onclick="order()">Sipariş Gönder</button>

<p id="codeBox"></p>

<hr>

<!-- SORGULAMA -->
<h2>Sipariş Sorgula</h2>
<input id="code" placeholder="Sipariş Kodu">
<button onclick="check()">Sorgula</button>
<p id="result"></p>

<hr>

<!-- SSS -->
<h2>SSS</h2>
<div class="card">✔ Teslim süresi 1-3 gün</div>
<div class="card">✔ Sipariş kodu ile takip edebilirsin</div>
<div class="card">✔ Ödemeler manuel alınır</div>

<!-- HAKKINDA -->
<h2>Hakkında</h2>
<div class="card">
Bu sistem online sipariş ve yönetim paneli için geliştirilmiştir.
</div>

<!-- İLETİŞİM -->
<h2>İletişim</h2>
<div class="card">
WhatsApp: 05xx xxx xx xx<br>
Email: info@site.com
</div>

<!-- YORUMLAR -->
<h2>Yorumlar</h2>
<input id="cname" placeholder="Adın">
<input id="comment" placeholder="Yorum yaz">
<button onclick="sendComment()">Gönder</button>

<div id="comments"></div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDiORFeKwko9d4YpXpj-qzfQ2-Pie5wuZI",
  authDomain: "online-a837e.firebaseapp.com",
  projectId: "online-a837e",
  storageBucket: "online-a837e.firebasestorage.app",
  messagingSenderId: "368141673909",
  appId: "1:368141673909:web:952a28912f3d04078865fc",
  measurementId: "G-STCBMJ0LH4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ÜRÜNLER */
db.collection("products").onSnapshot(snap=>{
  let html=""
  snap.forEach(doc=>{
    let p=doc.data()
    html+=`
    <div class="card">
      <h3>${p.name}</h3>
      <p>${p.price} TL</p>
      <small>${p.desc || ""}</small>
    </div>`
  })
  products.innerHTML=html
})

/* SİPARİŞ */
function order(){
  let code="AGT"+Math.floor(Math.random()*99999)

  db.collection("orders").add({
    name:name.value,
    phone:phone.value,
    product:product.value,
    note:note.value,
    status:"Beklemede",
    code:code,
    date:Date.now()
  })

  codeBox.innerHTML="✅ Sipariş alındı. Kod: <b>"+code+"</b>"
}

/* SORGULA */
function check(){
  db.collection("orders").where("code","==",code.value).get()
  .then(snap=>{
    if(snap.empty){
      result.innerText="❌ Bulunamadı"
    }else{
      snap.forEach(d=>{
        result.innerText="📦 Durum: "+d.data().status
      })
    }
  })
}

/* YORUM */
function sendComment(){
  db.collection("comments").add({
    name:cname.value,
    comment:comment.value,
    date:Date.now()
  })
}

/* YORUMLAR ÇEK */
db.collection("comments").orderBy("date","desc")
.onSnapshot(snap=>{
  let html=""
  snap.forEach(d=>{
    let c=d.data()
    html+=`<div class="card"><b>${c.name}</b><br>${c.comment}</div>`
  })
  comments.innerHTML=html
})
</script>

</body>
</html>
